plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.barta.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.barta.app"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "3.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'

    // Firebase - everything here is on the FREE Spark plan
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-auth'      // email + password login
    implementation 'com.google.firebase:firebase-firestore' // users, chats, messages
    implementation 'com.google.firebase:firebase-database'  // Realtime Database: online, typing, seen

    // Room (offline cache + in-chat search + scheduled message list)
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // WorkManager (scheduled messages) - runs on the phone, no server needed
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'com.google.guava:guava:33.2.1-android'

    // WebRTC (audio/video calls, peer-to-peer). Free, open source (Apache 2.0) build by Stream
    implementation 'io.getstream:stream-webrtc-android:1.3.9'

    // LiveData + app-level lifecycle (goes "offline" when the app is in the background)
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-process:2.8.4'
}
